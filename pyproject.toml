[project]
name = "winds-mobi-api"
version = "0.0.0"
description = "Python standalone asyncIO API that provides different endpoints to get weather data from winds.mobi mongodb."
authors = [
    { name = "winds.mobi" }
]
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiocache>=0.12.3",
    "fastapi[standard]>=0.136.3",
    "motor>=3.7.1",
    "opentelemetry-distro[otlp]>=0.56b0",
    "opentelemetry-instrumentation>=0.56b0",
    "opentelemetry-instrumentation-fastapi>=0.56b0",
    "opentelemetry-instrumentation-pymongo>=0.56b0",
    "orjson>=3.11.9",
    "parse-accept-language>=0.1.2",
    "pyaml>=25.7.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "scipy>=1.16.0",
    "sentry-sdk[fastapi]>=2.62.0",
    "stop-words>=2018.7.23",
    "ujson>=5.10.0",
]

[dependency-groups]
dev = [
    "locust",
    "pytest>=8.4.1",
    "python-dotenv",
    "ruff",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",
    "F",
    "SIM",
    "B",
    "UP",
    "I",
]
ignore = ["B008"]

